<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail-Notiz</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blau:#1C3040; --gelb:#F6D54B; --graublau:#4B7A9F; --beige:#E6E2DC;
    --text:#3B3B3B; --bg:#FFFFFF; --linie:#D9D5CF; --feld:#FFFFFF; --muted:#6B7280;
    --ok:#2E7D4F; --err:#B42318;
  }
  @media (prefers-color-scheme: dark){
    :root{ --text:#E9E7E3; --bg:#16222D; --linie:#2E4152; --feld:#1E2E3C; --muted:#9AA7B3; --beige:#2A3B4A; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Source Sans Pro","Source Sans 3",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14px}
  header{background:var(--blau);color:#fff;padding:12px 14px;border-bottom:3px solid var(--gelb)}
  header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.2px}
  header .mail{margin-top:4px;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:14px}
  label.t{display:block;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{border:1px solid var(--linie);background:var(--feld);color:var(--text);border-radius:999px;
        padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--graublau)}
  .chip.on{background:var(--blau);border-color:var(--blau);color:#fff}
  .chip.on.erledigt{background:var(--ok);border-color:var(--ok)}
  textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--linie);border-radius:6px;
           background:var(--feld);color:var(--text);padding:9px 10px;font:inherit;line-height:1.4}
  textarea:focus,input:focus{outline:2px solid var(--gelb);outline-offset:0;border-color:var(--blau)}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
  .quick button{border:none;background:var(--beige);color:var(--text);border-radius:4px;padding:4px 8px;font:inherit;font-size:12.5px;cursor:pointer}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  input[type=date]{border:1px solid var(--linie);border-radius:6px;background:var(--feld);color:var(--text);padding:6px 8px;font:inherit}
  .actions{display:flex;gap:8px;margin-top:16px}
  .btn{border:none;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--blau);color:#fff}
  .btn.ghost{background:transparent;color:var(--err);border:1px solid var(--linie)}
  .btn.ghost.confirm{background:var(--err);color:#fff;border-color:var(--err)}
  .status{margin-top:10px;font-size:12.5px;color:var(--muted);min-height:18px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .empty{padding:30px 14px;text-align:center;color:var(--muted)}
  .hidden{display:none}
  .count{float:right;font-weight:400;text-transform:none;letter-spacing:0}
</style>
</head>
<body>
<header>
  <h1>Mail-Notiz</h1>
  <div class="mail" id="mailInfo">–</div>
</header>

<div id="empty" class="empty hidden">Bitte eine Mail auswählen.</div>

<main id="form">
  <label class="t">Stand</label>
  <div class="chips" id="chips">
    <button class="chip" data-s="offen">Offen</button>
    <button class="chip" data-s="besprechung">Besprechung geplant</button>
    <button class="chip" data-s="abklaeren">Abklären</button>
    <button class="chip" data-s="warten">Warte auf Antwort</button>
    <button class="chip erledigt" data-s="erledigt">Erledigt</button>
  </div>

  <label class="t" for="text">Notiz <span class="count" id="count"></span></label>
  <textarea id="text" maxlength="1800" placeholder="z.B. Besprechung am Di. geplant / muss ich noch mit … abklären"></textarea>
  <div class="quick">
    <button data-q="Abklären mit ">+ Abklären mit …</button>
    <button data-q="Besprechung geplant am ">+ Besprechung am …</button>
    <button data-q="Rückruf an ">+ Rückruf an …</button>
    <button data-q="__DATE__">+ Datum</button>
  </div>

  <div class="row">
    <div>
      <label class="t" for="frist">Frist / Wiedervorlage</label>
      <input type="date" id="frist">
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="saveBtn">Speichern</button>
    <button class="btn ghost" id="delBtn">Notiz löschen</button>
  </div>
  <div class="status" id="status"></div>
</main>

<script>
(function(){
  "use strict";
  var PROP = "notiz";           // Name der Custom Property an der Mail
  var CAT  = "Notiz";           // Kategorie in der Mailliste
  var props = null, loadedItem = null, dirty = false, timer = null, delArmed = false;
  var state = { status:"", text:"", frist:"" };
  var $ = function(id){ return document.getElementById(id); };

  function catSupported(){
    return Office.context.requirements.isSetSupported("Mailbox","1.8");
  }

  Office.onReady(function(){
    bindUi();
    if (Office.context.requirements.isSetSupported("Mailbox","1.5")) {
      Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, onItemChanged);
    }
    ensureMasterCategory();
    loadItem();
  });

  // ---------- Laden ----------
  function loadItem(){
    var item = Office.context.mailbox.item;
    loadedItem = item; props = null; dirty = false; delArmed = false; resetDelBtn();
    if (!item) { $("form").classList.add("hidden"); $("empty").classList.remove("hidden"); $("mailInfo").textContent = "–"; return; }
    $("form").classList.remove("hidden"); $("empty").classList.add("hidden");
    var from = item.from ? (item.from.displayName || item.from.emailAddress) : "";
    $("mailInfo").textContent = (item.subject || "(ohne Betreff)") + (from ? "  ·  " + from : "");
    setMsg("Lade …");
    item.loadCustomPropertiesAsync(function(r){
      if (item !== Office.context.mailbox.item) return; // inzwischen andere Mail gewählt
      if (r.status !== Office.AsyncResultStatus.Succeeded) { setMsg("Fehler beim Laden: " + r.error.message, "err"); return; }
      props = r.value;
      var raw = props.get(PROP), d = {};
      if (raw) { try { d = JSON.parse(raw); } catch(e){ d = { text: String(raw) }; } }
      state = { status: d.status || "", text: d.text || "", frist: d.frist || "" };
      render();
      setMsg(d.updated ? "Zuletzt geändert: " + fmt(d.updated) : "Noch keine Notiz zu dieser Mail.");
    });
  }

  function onItemChanged(){
    // Ungespeicherte Änderung der vorherigen Mail noch sichern, dann neue Mail laden
    if (dirty && props) { clearTimeout(timer); save(null, true); }
    loadItem();
  }

  // ---------- UI ----------
  function bindUi(){
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(b){
      b.addEventListener("click", function(){
        state.status = (state.status === b.dataset.s) ? "" : b.dataset.s;
        renderChips(); changed(true);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".quick button"), function(b){
      b.addEventListener("click", function(){
        var q = b.dataset.q === "__DATE__" ? today() + ": " : b.dataset.q;
        insertText(q);
      });
    });
    $("text").addEventListener("input", function(){ state.text = $("text").value; updateCount(); changed(false); });
    $("text").addEventListener("blur", function(){ if (dirty) { clearTimeout(timer); save(); } });
    $("frist").addEventListener("change", function(){ state.frist = $("frist").value; changed(true); });
    $("saveBtn").addEventListener("click", function(){ clearTimeout(timer); save(); });
    $("delBtn").addEventListener("click", onDelete);
    document.addEventListener("keydown", function(e){
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); clearTimeout(timer); save(); }
    });
  }

  function render(){
    $("text").value = state.text; $("frist").value = state.frist;
    renderChips(); updateCount();
  }
  function renderChips(){
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(b){
      b.classList.toggle("on", b.dataset.s === state.status);
    });
  }
  function updateCount(){ var n = $("text").value.length; $("count").textContent = n ? n + " / 1800" : ""; }

  function insertText(s){
    var ta = $("text"), a = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    var pre = (a > 0 && v[a-1] !== "\n") ? "\n" : "";
    ta.value = v.slice(0,a) + pre + s + v.slice(e);
    var pos = a + pre.length + s.length;
    ta.focus(); ta.setSelectionRange(pos,pos);
    state.text = ta.value; updateCount(); changed(false);
  }

  function changed(immediate){
    dirty = true; setMsg("Nicht gespeichert …");
    clearTimeout(timer);
    timer = setTimeout(save, immediate ? 150 : 1200);   // Autospeichern
  }

  // ---------- Speichern ----------
  function save(cb, skipCategory){
    if (!props) { cb && cb(); return; }
    var d = { status: state.status, text: (state.text || "").replace(/\s+$/,""), frist: state.frist };
    var hasContent = !!(d.text || d.status || d.frist);
    if (hasContent) { d.updated = new Date().toISOString(); props.set(PROP, JSON.stringify(d)); }
    else { props.remove(PROP); }
    setMsg("Speichere …");
    props.saveAsync(function(r){
      if (r.status === Office.AsyncResultStatus.Succeeded) {
        dirty = false;
        setMsg(hasContent ? "Gespeichert ✓  " + fmt(d.updated) : "Notiz entfernt.", "ok");
      } else {
        setMsg("Fehler beim Speichern: " + r.error.message, "err");
      }
      if (!skipCategory) updateCategory(hasContent && d.status !== "erledigt");
      cb && cb();
    });
  }

  function onDelete(){
    if (!delArmed) { delArmed = true; $("delBtn").textContent = "Wirklich löschen?"; $("delBtn").classList.add("confirm");
      setTimeout(function(){ delArmed = false; resetDelBtn(); }, 3000); return; }
    delArmed = false; resetDelBtn();
    state = { status:"", text:"", frist:"" }; render(); clearTimeout(timer); save();
  }
  function resetDelBtn(){ var b = $("delBtn"); b.textContent = "Notiz löschen"; b.classList.remove("confirm"); }

  // ---------- Kategorie ----------
  function ensureMasterCategory(){
    if (!catSupported()) return;
    var mc = Office.context.mailbox.masterCategories;
    mc.getAsync(function(r){
      if (r.status !== Office.AsyncResultStatus.Succeeded) return;
      var exists = (r.value || []).some(function(c){ return c.displayName === CAT; });
      if (!exists) mc.addAsync([{ displayName: CAT, color: Office.MailboxEnums.CategoryColor.Preset3 }], function(){});
    });
  }

  function updateCategory(shouldHave){
    var item = Office.context.mailbox.item;
    if (!catSupported() || !item || item !== loadedItem) return;
    item.categories.getAsync(function(r){
      if (r.status !== Office.AsyncResultStatus.Succeeded) return;
      var has = (r.value || []).some(function(c){ return c.displayName === CAT; });
      if (shouldHave && !has) item.categories.addAsync([CAT], function(){});
      if (!shouldHave && has) item.categories.removeAsync([CAT], function(){});
    });
  }

  // ---------- Hilfsfunktionen ----------
  function setMsg(t, cls){ var s = $("status"); s.textContent = t || ""; s.className = "status" + (cls ? " " + cls : ""); }
  function fmt(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleString("de-CH", { timeZone:"Europe/Zurich", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    } catch(e){ return iso; }
  }
  function today(){ return new Date().toLocaleDateString("de-CH", { timeZone:"Europe/Zurich", day:"2-digit", month:"2-digit", year:"numeric" }); }
})();
</script>
</body>
</html>
